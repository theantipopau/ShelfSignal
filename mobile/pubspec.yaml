name: shelfsignal
description: Premium iOS/Android price monitoring app for Australian shoppers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management (Riverpod only — provider removed)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Utilities
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.2.3

  # Barcode Scanning (deferred until camera path is enabled)
  # mobile_scanner: ^5.2.3

  # Firebase (disabled until google-services.json / GoogleService-Info.plist are added;
  # the app runs fully without it via demo mode)
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3

  # UI/UX
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
