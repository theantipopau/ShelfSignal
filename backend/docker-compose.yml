services:
  postgres:
    image: postgres:16-alpine
    container_name: shelfsignal-postgres
    environment:
      POSTGRES_USER: shelfsignal
      POSTGRES_PASSWORD: shelfsignal
      POSTGRES_DB: shelfsignal
    ports:
      - '5432:5432'
    volumes:
      - shelfsignal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shelfsignal -d shelfsignal']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shelfsignal_pgdata:
